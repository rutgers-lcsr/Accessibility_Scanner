<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Rutgers Accessibility Scanner</title>
    </head>
    <body style="margin:0;padding:0;background:#f2f2f2;color:#222222;font-family:'Segoe UI',Arial,sans-serif;">
        <div style="max-width:600px;margin:40px auto;background:#ffffff;border:1px solid #d8d8d8;border-radius:8px;padding:32px;">
            <div style="background:#cc0033;color:#ffffff;padding:16px 32px;border-radius:8px 8px 0 0;font-size:1.5em;font-weight:bold;letter-spacing:1px;">Rutgers LCSR Accessibility Scanner</div>
            <div style="padding:24px 0;color:#222222;font-size:1em;line-height:1.5;">
                {% block content %}
                {% endblock content %}
            </div>
            <div style="background:#f2f2f2;color:#666666;padding:16px 32px;border-radius:0 0 8px 8px;font-size:0.9em;text-align:center;">{{ year }} LCSR Rutgers University | Accessibility Scanner</div>
        </div>
    </body>
</html>
