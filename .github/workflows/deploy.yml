name: Deploy A11y

on:
    push:
        branches:
            - main

permissions:
    contents: read

jobs:
    # Lint, type check, tests and build (ci.yml). Nothing is deployed unless they pass.
    test:
        uses: ./.github/workflows/ci.yml

    deploy:
        needs: test
        environment: production
        runs-on: production-a11y
        env:
            NFS_SERVER_IP: ${{ vars.NFS_SERVER_IP }}
            NFS_SHARE_PATH: ${{ vars.NFS_SHARE_PATH }}
            HOSTNAME: ${{ vars.CLIENT_URL }}
            NEXT_PUBLIC_BASE_URL: ${{ vars.NEXT_PUBLIC_BASE_URL }}
            NEXT_PUBLIC_CAS_URL: ${{ vars.NEXT_PUBLIC_CAS_URL }}
            NEXT_CAS_CLIENT_SAML_TOLERANCE: ${{ vars.NEXT_CAS_CLIENT_SAML_TOLERANCE }}
            NEXT_CAS_CLIENT_SECRET: ${{ secrets.NEXT_CAS_CLIENT_SECRET }}
        steps:
            - name: Checkout Code
              uses: actions/checkout@v7

            - name: Set up Certs
              run: |
                  HOSTNAME=$(hostname)
                  cp -rflT /etc/letsencrypt/live/$HOSTNAME/ certs/

            - name: Setup environment
              run: |
                  cat <<EOF > .env
                  DEBUG=${{vars.DEBUG}}
                  FLASK_ENV=${{vars.FLASK_ENV}}
                  TESTING=${{vars.TESTING}}
                  JWT_SECRET_KEY=${{secrets.JWT_SECRET_KEY}}
                  INTERNAL_AUTH_SECRET=${{secrets.INTERNAL_AUTH_SECRET}}
                  CLIENT_URL=${{vars.CLIENT_URL}}
                  MAIL_SERVER=${{vars.MAIL_SERVER}}
                  MAIL_PORT=${{vars.MAIL_PORT}}
                  MAIL_DEFAULT_SENDER=${{vars.MAIL_DEFAULT_SENDER}}
                  SITE_ADMINS=${{vars.SITE_ADMINS}}
                  ADMIN_EMAIL=${{vars.ADMIN_EMAIL}}
                  ADMIN_PASSWORD=${{secrets.ADMIN_PASSWORD}}
                  DB_ROOT_PASSWORD=${{secrets.DB_ROOT_PASSWORD}}
                  DB_PASSWORD=${{secrets.DB_PASSWORD}}
                  NFS_SERVER_IP=${{ vars.NFS_SERVER_IP }}
                  NFS_SHARE_PATH=${{ vars.NFS_SHARE_PATH }}
                  NEXT_PUBLIC_BASE_URL=${{ vars.NEXT_PUBLIC_BASE_URL }}
                  NEXT_PUBLIC_CAS_URL=${{ vars.NEXT_PUBLIC_CAS_URL }}
                  NEXT_CAS_CLIENT_SAML_TOLERANCE=${{ vars.NEXT_CAS_CLIENT_SAML_TOLERANCE }}
                  NEXT_CAS_CLIENT_SECRET=${{ secrets.NEXT_CAS_CLIENT_SECRET }}
                  EOF
            - name: build and deploy
              run: |
                  docker compose -f docker-compose.yml build
                  docker compose -f docker-compose.yml up -d --remove-orphans

            - name: restart nginx
              run: |
                  docker restart a11y_nginx

            - name: Wait for services to be up
              run: |
                  sleep 20

            - name: check for api docker container
              run: |
                  status=$(docker inspect -f '{{.State.Status}}' a11y_api)
                  if [ "$status" != "running" ]; then
                      echo "API container is not running as expected. Current status: $status"
                      docker logs a11y_api
                      exit 1
                  fi

            # Same probes as the compose healthchecks, run once instead of waiting for them.
            - name: check the api and frontend answer /health
              run: |
                  for i in 1 2 3 4 5 6; do
                      if docker exec a11y_api curl -fsS http://localhost:5000/health \
                          && docker exec a11y_nextjs node -e "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"; then
                          echo "API and frontend are healthy"
                          exit 0
                      fi
                      echo "Not ready yet, retrying in 10s ($i/6)"
                      sleep 10
                  done
                  echo "API or frontend did not answer /health"
                  docker logs --tail 100 a11y_api
                  docker logs --tail 100 a11y_nextjs
                  exit 1

            - name: Remove docker artifacts
              run: |
                  docker system prune -f

            - name: Notify deployment success
              run: echo "Deployment to production server successful!"
